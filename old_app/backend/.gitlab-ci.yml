image: docker:latest


services:
  - docker:dind


stages:
  - build_master
  - deploy_master
  - build_dev
  - deploy_dev


build_master:
  stage: build_master
  only:
    - master
  script:
    - docker login -u $DOCKER_REGISTRY_USER -p $DOCKER_REGISTRY_PASSWORD
    - docker build -t $ORG_NAMESPACE/$CI_PROJECT_NAMESPACE-$CI_PROJECT_NAME:master .
    - docker push $ORG_NAMESPACE/$CI_PROJECT_NAMESPACE-$CI_PROJECT_NAME:master


deploy_master:
  stage: deploy_master
  image: cdrx/rancher-gitlab-deploy
  only:
    - master
  script:
    - upgrade --environment botshop-production --stack terra-prod --service backend --new-image $ORG_NAMESPACE/$CI_PROJECT_NAMESPACE-$CI_PROJECT_NAME:master --create

build_dev:
  stage: build_dev
  only:
    - dev
  script:
    - docker login -u $DOCKER_REGISTRY_USER -p $DOCKER_REGISTRY_PASSWORD
    - docker build -t $ORG_NAMESPACE/$CI_PROJECT_NAMESPACE-$CI_PROJECT_NAME:dev .
    - docker push $ORG_NAMESPACE/$CI_PROJECT_NAMESPACE-$CI_PROJECT_NAME:dev


deploy_dev:
  stage: deploy_dev
  image: cdrx/rancher-gitlab-deploy
  only:
    - dev
  script:
    - upgrade --environment botshop-production --stack terra-dev --service backend --new-image $ORG_NAMESPACE/$CI_PROJECT_NAMESPACE-$CI_PROJECT_NAME:dev --create
